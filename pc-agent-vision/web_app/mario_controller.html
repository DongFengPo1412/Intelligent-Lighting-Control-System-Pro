<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
<meta name="theme-color" content="#0b0f14" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<title>MARIO16 蓝牙手柄</title>
<style>
  :root {
    --bg: #0b0f14;
    --panel: #141b24;
    --panel-2: #1d2733;
    --line: #2a3745;
    --text: #e8eef5;
    --dim: #8b9aab;
    --gold: #ffd23f;
    --red: #ff4d3d;
    --green: #35c759;
    --blue: #3d8bff;
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  html, body {
    margin: 0;
    height: 100%;
    overflow: hidden;
    background: var(--bg);
    color: var(--text);
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Courier New", monospace;
    user-select: none;
    -webkit-user-select: none;
    touch-action: none;
    overscroll-behavior: none;
  }

  #app {
    position: fixed;
    inset: 0;
    display: flex;
    flex-direction: column;
    padding: calc(8px + env(safe-area-inset-top)) calc(10px + env(safe-area-inset-right))
             calc(8px + env(safe-area-inset-bottom)) calc(10px + env(safe-area-inset-left));
    gap: 8px;
  }

  /* ---------------- 顶栏 ---------------- */
  header {
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 12px;
  }

  .brand {
    font-size: 15px;
    font-weight: 700;
    letter-spacing: 2px;
    color: var(--gold);
    text-shadow: 0 0 12px rgba(255, 210, 63, .35);
    white-space: nowrap;
  }

  .status {
    display: flex;
    align-items: center;
    gap: 6px;
    color: var(--dim);
    min-width: 0;
    flex: 1;
  }

  .dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: #5b6672;
    flex: none;
  }
  .dot.on { background: var(--green); box-shadow: 0 0 8px var(--green); }
  .dot.busy { background: var(--gold); animation: blink .8s steps(2) infinite; }

  #deviceName {
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  @keyframes blink { 50% { opacity: .25; } }

  button {
    font: inherit;
    color: inherit;
    background: var(--panel-2);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 8px 12px;
    cursor: pointer;
    touch-action: none;
  }
  button:active { transform: translateY(1px); }
  button.primary {
    background: linear-gradient(180deg, #2f7bff, #1d5edb);
    border-color: #4a90ff;
    color: #fff;
    font-weight: 700;
  }
  button.ghost { background: transparent; }
  button:disabled { opacity: .45; }

  /* ---------------- HUD ---------------- */
  #hud {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 6px;
  }

  .stat {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 6px 8px;
    display: flex;
    flex-direction: column;
    gap: 2px;
    min-width: 0;
  }
  .stat b {
    font-size: 16px;
    letter-spacing: 1px;
    font-variant-numeric: tabular-nums;
  }
  .stat span {
    font-size: 10px;
    color: var(--dim);
    letter-spacing: 1px;
  }
  .stat.gold b { color: var(--gold); }
  .stat.red b { color: var(--red); }
  .stat.green b { color: var(--green); }

  #progressWrap {
    grid-column: 1 / -1;
    height: 6px;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 999px;
    overflow: hidden;
  }
  #progress {
    height: 100%;
    width: 0%;
    background: linear-gradient(90deg, var(--green), var(--gold));
    transition: width .25s linear;
  }

  /* ---------------- 手柄区 ---------------- */
  #stage {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    min-height: 0;
    padding: 4px 2px;
  }

  /* 十字键 */
  #dpad {
    position: relative;
    width: min(46vw, 42vh, 220px);
    aspect-ratio: 1 / 1;
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    grid-template-rows: repeat(3, 1fr);
    gap: 4px;
    flex: none;
  }

  .dkey {
    background: var(--panel-2);
    border: 1px solid var(--line);
    border-radius: 12px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 20px;
    color: var(--dim);
    transition: background .06s, color .06s, box-shadow .06s;
  }
  .dkey.active {
    background: rgba(61, 139, 255, .25);
    border-color: var(--blue);
    color: #cfe2ff;
    box-shadow: 0 0 14px rgba(61, 139, 255, .35) inset;
  }

  #kLeft  { grid-area: 2 / 1; border-top-right-radius: 4px; border-bottom-right-radius: 4px; }
  #kRight { grid-area: 2 / 3; border-top-left-radius: 4px; border-bottom-left-radius: 4px; }
  #kUp    { grid-area: 1 / 2; border-bottom-left-radius: 4px; border-bottom-right-radius: 4px; }
  #kDown  { grid-area: 3 / 2; border-top-left-radius: 4px; border-top-right-radius: 4px; }
  #dpadCenter {
    grid-area: 2 / 2;
    border-radius: 12px;
    background:
      radial-gradient(circle at 50% 50%, #24303d 0 40%, #1a232d 41% 100%);
    border: 1px solid var(--line);
  }

  /* 右侧按钮 */
  #actions {
    display: flex;
    align-items: center;
    gap: clamp(10px, 3vw, 22px);
    flex: none;
    transform: rotate(-8deg);
  }

  .abtn {
    width: clamp(66px, 18vw, 92px);
    height: clamp(66px, 18vw, 92px);
    border-radius: 50%;
    font-size: clamp(20px, 5vw, 26px);
    font-weight: 700;
    letter-spacing: 1px;
    display: flex;
    align-items: center;
    justify-content: center;
    border: 2px solid transparent;
    color: #10161d;
    transition: transform .05s, box-shadow .05s, filter .05s;
  }
  #kA {
    background: radial-gradient(circle at 35% 30%, #7df29a, var(--green) 60%, #1f8f3d);
    box-shadow: 0 6px 0 #146b2c, 0 10px 22px rgba(53, 199, 89, .25);
  }
  #kB {
    background: radial-gradient(circle at 35% 30%, #ff9a8f, var(--red) 60%, #b8291d);
    box-shadow: 0 6px 0 #7d1b13, 0 10px 22px rgba(255, 77, 61, .25);
    margin-top: 26px;
  }
  #kA.active, #kB.active { transform: translateY(4px); box-shadow: 0 2px 0 rgba(0, 0, 0, .5); filter: brightness(1.25); }

  #startRow {
    display: flex;
    gap: 8px;
    justify-content: center;
  }
  .pill {
    border-radius: 999px;
    padding: 10px 22px;
    font-size: 12px;
    letter-spacing: 2px;
    color: var(--text);
    background: var(--panel-2);
    border: 1px solid var(--line);
  }
  .pill.active { background: rgba(255, 210, 63, .2); border-color: var(--gold); color: var(--gold); }

  /* 工具栏 */
  #tools {
    display: flex;
    gap: 6px;
    align-items: center;
    font-size: 11px;
  }
  #tools button { padding: 6px 10px; font-size: 11px; border-radius: 8px; }
  #tools input[type="range"] { flex: 1; min-width: 60px; accent-color: var(--gold); }

  #log {
    height: 14px;
    font-size: 10px;
    color: var(--dim);
    overflow: hidden;
    white-space: nowrap;
    text-overflow: ellipsis;
    flex: none;
  }

  /* ---------------- 遮罩 ---------------- */
  #overlay {
    position: fixed;
    inset: 0;
    background: rgba(5, 8, 12, .82);
    backdrop-filter: blur(3px);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 14px;
    padding: 24px;
    text-align: center;
    z-index: 20;
  }
  #overlay.hidden { display: none; }
  #overlay h1 {
    margin: 0;
    font-size: 26px;
    letter-spacing: 4px;
    color: var(--gold);
  }
  #overlay p {
    margin: 0;
    max-width: 30em;
    font-size: 12px;
    line-height: 1.7;
    color: var(--dim);
  }
  #overlay .big {
    padding: 16px 34px;
    font-size: 15px;
    letter-spacing: 2px;
    border-radius: 14px;
  }
  .err { color: #ff8f84 !important; }

  @media (orientation: landscape) and (max-height: 560px) {
    #hud { grid-template-columns: repeat(4, 1fr); }
    .stat b { font-size: 14px; }
    #log { display: none; }
    header { font-size: 11px; }
  }

  @media (min-width: 720px) {
    #app { max-width: 900px; margin: 0 auto; }
  }
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="brand">MARIO16</div>
    <div class="status">
      <div id="dot" class="dot"></div>
      <div id="deviceName">未连接</div>
    </div>
    <button id="btnConnect" class="primary">连接</button>
    <button id="btnFull" class="ghost" title="全屏">⛶</button>
  </header>

  <section id="hud">
    <div class="stat gold"><span>SCORE</span><b id="hScore">0</b></div>
    <div class="stat red"><span>LIVES</span><b id="hLives">3</b></div>
    <div class="stat gold"><span>COINS</span><b id="hCoins">0</b></div>
    <div class="stat green"><span>STATE</span><b id="hState">--</b></div>
    <div id="progressWrap"><div id="progress"></div></div>
  </section>

  <section id="stage">
    <div id="dpad">
      <div id="dpadCenter"></div>
      <div class="dkey" id="kUp"    data-key="up">▲</div>
      <div class="dkey" id="kLeft"  data-key="left">◀</div>
      <div class="dkey" id="kRight" data-key="right">▶</div>
      <div class="dkey" id="kDown"  data-key="down">▼</div>
    </div>

    <div id="actions">
      <div class="abtn" id="kB" data-key="b">B</div>
      <div class="abtn" id="kA" data-key="a">A</div>
    </div>
  </section>

  <div id="startRow">
    <button class="pill" id="kStart" data-key="start">START / PAUSE</button>
  </div>

  <div id="tools">
    <button id="btnReset">重开</button>
    <button id="btnTest">灯板测试</button>
    <span style="color:var(--dim)">亮度</span>
    <input id="bright" type="range" min="4" max="255" value="60" />
  </div>

  <div id="log">准备就绪</div>
</div>

<div id="overlay">
  <h1>MARIO16</h1>
  <p>
    16×16 WS2812 灯板 · 蓝牙手柄<br />
    先给板子上电，再点下面的按钮选择设备 <b>MARIO16</b>。
  </p>
  <p id="overlayHint" class="err" style="display:none"></p>
  <button id="btnConnectBig" class="primary big">连接灯板</button>
</div>

<script>
"use strict";

/* =====================================================================
 * BLE：Nordic UART Service（和固件里的 UUID 一致）
 * ===================================================================== */
const SERVICE_UUID = "6e400001-b5a3-f393-e0a9-e50e24dcca9e";
const RX_UUID      = "6e400002-b5a3-f393-e0a9-e50e24dcca9e"; // 手机 -> 板子（write）
const TX_UUID      = "6e400003-b5a3-f393-e0a9-e50e24dcca9e"; // 板子 -> 手机（notify）

const ui = {
  dot: document.getElementById("dot"),
  deviceName: document.getElementById("deviceName"),
  overlay: document.getElementById("overlay"),
  overlayHint: document.getElementById("overlayHint"),
  btnConnect: document.getElementById("btnConnect"),
  btnConnectBig: document.getElementById("btnConnectBig"),
  log: document.getElementById("log"),
  score: document.getElementById("hScore"),
  lives: document.getElementById("hLives"),
  coins: document.getElementById("hCoins"),
  state: document.getElementById("hState"),
  progress: document.getElementById("progress"),
};

const STATE_NAMES = ["标题", "准备", "游戏", "暂停", "死亡", "结束", "通关"];

let device = null;
let rxChar = null;
let txChar = null;
let connected = false;
let connecting = false;
let reconnectTimer = null;
let reconnectTries = 0;
let notifyBuf = "";
let writeChain = Promise.resolve();

const held = new Set();

function log(msg) {
  ui.log.textContent = msg;
}

function setStatus(kind, text) {
  ui.dot.className = "dot" + (kind ? " " + kind : "");
  ui.deviceName.textContent = text;
}

function showOverlay(show, hint) {
  ui.overlay.classList.toggle("hidden", !show);
  if (hint) {
    ui.overlayHint.textContent = hint;
    ui.overlayHint.style.display = "block";
  } else {
    ui.overlayHint.style.display = "none";
  }
}

/* ------------------------------ 发送 ------------------------------ */
// 只用 2~4 个字节的短命令：不依赖 BLE MTU 协商，任何浏览器都稳。
// 按键: L/R/U/D/A/B/S/X + 1(按下)/0(松开)
// 命令: #R 重开, #P 暂停, #T 灯板测试, #? 查询状态, #B<0-255> 亮度
const KEY_CODE = { left: "L", right: "R", up: "U", down: "D", a: "A", b: "B", start: "S", select: "X" };

function rawSendText(text) {
  if (!connected || !rxChar) return;
  const bytes = new TextEncoder().encode(text + "\n");
  // 串行化写入，避免 "GATT operation already in progress"
  writeChain = writeChain
    .then(() => rxChar.writeValueWithoutResponse(bytes))
    .catch((e) => log("写入失败: " + e.message));
}

function sendKey(key, down) {
  const code = KEY_CODE[key];
  if (!code) return;
  rawSendText(code + (down ? "1" : "0"));
}

function sendCmd(code, arg) {
  if (!connected) {
    log("未连接，命令未发送");
    return;
  }
  rawSendText("#" + code + (arg === undefined ? "" : arg));
}

/* ------------------------------ 按键 ------------------------------ */
function setKeyUI(key, down) {
  const el = document.querySelector('[data-key="' + key + '"]');
  if (el) el.classList.toggle("active", down);
}

function pressKey(key) {
  if (held.has(key)) return;
  held.add(key);
  setKeyUI(key, true);
  sendKey(key, true);
  if (navigator.vibrate) navigator.vibrate(8);
}

function releaseKey(key) {
  if (!held.has(key)) return;
  held.delete(key);
  setKeyUI(key, false);
  sendKey(key, false);
}

function releaseAll() {
  for (const k of Array.from(held)) releaseKey(k);
}

document.querySelectorAll("[data-key]").forEach((el) => {
  const key = el.dataset.key;

  el.addEventListener("pointerdown", (e) => {
    e.preventDefault();
    try { el.setPointerCapture(e.pointerId); } catch (err) { /* ignore */ }
    pressKey(key);
  });

  el.addEventListener("pointerup", (e) => {
    e.preventDefault();
    releaseKey(key);
  });

  el.addEventListener("pointercancel", () => releaseKey(key));
  el.addEventListener("lostpointercapture", () => releaseKey(key));
  el.addEventListener("contextmenu", (e) => e.preventDefault());
});

// 键盘（电脑上调试用）
const KEYMAP = {
  ArrowLeft: "left", ArrowRight: "right", ArrowUp: "up", ArrowDown: "down",
  KeyA: "a", KeyB: "b", Space: "a", ShiftLeft: "b", Enter: "start",
  KeyJ: "a", KeyK: "b",
};
window.addEventListener("keydown", (e) => {
  if (e.target && e.target.tagName === "INPUT") return;
  const k = KEYMAP[e.code];
  if (!k) return;
  e.preventDefault();
  pressKey(k);
});
window.addEventListener("keyup", (e) => {
  if (e.target && e.target.tagName === "INPUT") return;
  const k = KEYMAP[e.code];
  if (!k) return;
  e.preventDefault();
  releaseKey(k);
});
window.addEventListener("blur", releaseAll);
document.addEventListener("visibilitychange", () => {
  if (document.hidden) releaseAll();
});

/* ------------------------------ 连接 ------------------------------ */
function bleSupported() {
  return typeof navigator !== "undefined" && !!navigator.bluetooth;
}

async function connect() {
  if (connecting) return;
  if (!bleSupported()) {
    showOverlay(true, "这个浏览器不支持 Web Bluetooth。请用 Android Chrome / Edge 打开，或 iOS 用 Bluefy 浏览器。");
    return;
  }
  if (!window.isSecureContext) {
    showOverlay(true, "当前页面不是 HTTPS，浏览器禁止蓝牙。请用 https:// 打开，或换成本机的 https 服务 / Bluefy。");
    return;
  }

  connecting = true;
  clearTimeout(reconnectTimer);
  ui.btnConnect.disabled = true;
  ui.btnConnect.textContent = "连接中";
  setStatus("busy", "搜索中…");

  try {
    device = await navigator.bluetooth.requestDevice({
      filters: [
        { namePrefix: "MARIO" },
        { services: [SERVICE_UUID] },
      ],
      optionalServices: [SERVICE_UUID],
    });

    device.addEventListener("gattserverdisconnected", onDisconnected);
    await openGatt();
  } catch (e) {
    connecting = false;
    ui.btnConnect.disabled = false;
    ui.btnConnect.textContent = "连接";
    setStatus("", "未连接");
    if (e && e.name === "NotFoundError") {
      log("已取消选择");
      setStatus("", "未连接");
    } else {
      log("连接失败: " + (e && e.message ? e.message : e));
      setStatus("", "连接失败");
    }
  }
}

async function openGatt() {
  const server = await device.gatt.connect();
  const service = await server.getPrimaryService(SERVICE_UUID);

  rxChar = await service.getCharacteristic(RX_UUID);
  txChar = await service.getCharacteristic(TX_UUID);

  await txChar.startNotifications();
  txChar.addEventListener("characteristicvaluechanged", onNotify);

  connected = true;
  connecting = false;
  reconnectTries = 0;
  ui.btnConnect.disabled = false;
  ui.btnConnect.textContent = "断开";
  setStatus("on", device.name || "MARIO16");
  showOverlay(false);
  log("已连接，按键试试");
  sendCmd("?");
  // 同步一次亮度（把滑块值推给板子）
  sendCmd("B", Number(document.getElementById("bright").value));
}

async function disconnect() {
  releaseAll();
  connected = false;
  clearTimeout(reconnectTimer);
  if (device && device.gatt.connected) {
    try { device.gatt.disconnect(); } catch (e) { /* ignore */ }
  }
  rxChar = null;
  txChar = null;
  ui.btnConnect.textContent = "连接";
  setStatus("", "未连接");
  showOverlay(true);
}

function onDisconnected() {
  connected = false;
  rxChar = null;
  txChar = null;
  releaseAll();
  setStatus("", "已断开");
  ui.btnConnect.textContent = "连接";
  showOverlay(true, "连接已断开，正在自动重连…");

  if (device && reconnectTries < 8) {
    reconnectTries += 1;
    reconnectTimer = setTimeout(async () => {
      try {
        await openGatt();
        showOverlay(false);
      } catch (e) {
        log("重连失败，再试一次…");
        onDisconnected();
      }
    }, 1200);
  }
}

/* ------------------------------ 通知 ------------------------------ */
function onNotify(event) {
  const value = event.target.value;
  const text = new TextDecoder().decode(value);
  notifyBuf += text;
  let idx;
  while ((idx = notifyBuf.indexOf("\n")) >= 0) {
    const line = notifyBuf.slice(0, idx).trim();
    notifyBuf = notifyBuf.slice(idx + 1);
    if (!line) continue;
    try {
      applyStatus(JSON.parse(line));
    } catch (e) {
      /* 忽略非 JSON */
    }
  }
  if (notifyBuf.length > 512) notifyBuf = "";
}

function applyStatus(s) {
  if (typeof s.s === "number") ui.score.textContent = s.s;
  if (typeof s.l === "number") ui.lives.textContent = s.l;
  if (typeof s.c === "number") ui.coins.textContent = s.c;
  if (typeof s.st === "number") {
    ui.state.textContent = STATE_NAMES[s.st] || String(s.st);
    ui.state.style.color = s.st === 2 ? "var(--green)" : s.st === 5 ? "var(--red)" : "var(--gold)";
  }
  if (typeof s.p === "number") ui.progress.style.width = Math.max(0, Math.min(100, s.p)) + "%";
}

/* ------------------------------ 其它按钮 ------------------------------ */
document.getElementById("btnConnect").addEventListener("click", () => {
  if (connected) disconnect();
  else connect();
});
ui.btnConnectBig.addEventListener("click", connect);

document.getElementById("btnReset").addEventListener("click", () => sendCmd("R"));
document.getElementById("btnTest").addEventListener("click", () => {
  sendCmd("T");
  log("灯板测试：左上红 / 右上绿 / 左下蓝 / 右下白");
});

const bright = document.getElementById("bright");
let brightTimer = null;
bright.addEventListener("input", () => {
  clearTimeout(brightTimer);
  const v = Number(bright.value);
  brightTimer = setTimeout(() => sendCmd("B", v), 120);
});

document.getElementById("btnFull").addEventListener("click", async () => {
  try {
    if (!document.fullscreenElement) await document.documentElement.requestFullscreen();
    else await document.exitFullscreen();
  } catch (e) {
    log("全屏不可用: " + e.message);
  }
});

/* ------------------------------ 启动 ------------------------------ */
if (!bleSupported()) {
  showOverlay(true, "当前浏览器不支持 Web Bluetooth。Android 用 Chrome，iOS 用 Bluefy 打开本页。");
} else if (!window.isSecureContext) {
  showOverlay(true, "当前不是 HTTPS 页面，浏览器会拒绝蓝牙。请通过 https:// 或 localhost 访问。");
}
setStatus("", "未连接");
</script>
</body>
</html>
