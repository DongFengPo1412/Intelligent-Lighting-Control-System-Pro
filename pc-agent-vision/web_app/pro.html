<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Amadeus · Pro 控制台</title>
<style>body{background:#101319;color:#e7e4dc;font:16px system-ui;margin:0}main{max-width:1100px;margin:auto;padding:20px}h1{color:#ffad64}section{padding:18px;background:#1b2029;margin:14px 0;border:1px solid #46515f;border-radius:10px}button,input,select,textarea{font:inherit;padding:9px;margin:5px;border-radius:6px}button{background:#ffc183;border:0;cursor:pointer}label{display:inline-block}canvas{max-width:100%;touch-action:none}#view{width:100%;height:400px;background:#080b0f}#editor{width:320px;height:320px;image-rendering:pixelated}textarea{display:block;width:90%;min-height:70px}pre{white-space:pre-wrap}a{color:#ffc183}.row{display:flex;gap:20px;flex-wrap:wrap}#notice{position:sticky;top:0;background:#252c36;padding:12px;z-index:2}</style></head><body><main>
<h1>Amadeus · Pro 控制台</h1><a href="/">原控制台</a><p id="connectionState">正在读取连接状态…</p><p id="notice" role="status">请选择模式，或使用下方的像素、记忆和交互功能。</p>
<section><h2>灯板与 3D 预览</h2><label>模式<select id="mode"></select></label><button id="applyMode">切换</button><label>亮度<input id="brightness" type="number" min="0" max="60" value="20"></label><button id="applyBrightness">设置亮度</button><label>音量<input id="volume" type="number" min="0" max="100" value="70"></label><button id="applyVolume">设置音量</button><label>倒计时秒数<input id="seconds" type="number" min="1" max="86400" value="60"></label><button id="timer">开始倒计时</button>
<canvas id="view" width="1000" height="500" aria-label="16×16 LED 三维预览"></canvas><p id="frameSource">尚无帧数据</p><label>预览曝光<input id="previewExposure" type="range" min="1" max="6" step=".25" value="3"></label><p>拖动旋转视角。预览基于回读 PWM 数据；曝光与光晕只改变屏幕展示，不改变灯板输出，不能代替实际色度测量。</p></section>
<section><h2>像素画布</h2><div class="row"><canvas id="editor" width="320" height="320" aria-label="16×16 像素编辑器"></canvas><div><input id="color" type="color" value="#a82d16"><button id="clearCanvas">清空草稿</button><button id="sendCanvas">应用到灯板</button><button id="saveCanvas">导出画布</button><input id="loadCanvas" type="file" accept="application/json"></div></div></section>
<section><h2>对话与持久记忆</h2><textarea id="chat" placeholder="向红莉栖说话；使用“记住：…”保存事实"></textarea><button id="sendChat">发送</button><pre id="reply"></pre><textarea id="memoryText" placeholder="保存的个人偏好或参考资料"></textarea><button id="addMemory">保存记忆</button><button id="addDocument">导入参考资料</button><button id="listMemory">刷新记忆</button><div id="memories"></div></section>
<section><h2>视觉与体感</h2><p>启用后使用电脑摄像头。视线游戏控制需要先完成校准；表情提示是启发式信号。</p><select id="visionMode"><option value="pet">陪伴与离席</option><option value="fingertip">指尖追踪</option><option value="sandbox">光球抓投</option><option value="gesture_game">手势游戏</option><option value="gaze_game">视线游戏</option><option value="identity">登记人脸问候</option></select><input id="camera" type="number" min="0" max="9" value="0"><button id="visionStart">启用</button><button id="visionStop">停止</button><input id="identity" placeholder="登记名称"><button id="enroll">登记当前人脸</button><button id="calibrate">开始九点视线校准</button><p id="calibration"></p><button id="sampleGaze">采集当前校准点</button><pre id="visionStatus"></pre></section>
<section><h2>音乐与游戏难度</h2><input id="musicFile" type="file" accept="audio/*"><input id="musicUrl" type="url" placeholder="HTTP(S) 直链音频"><button id="playUrl">播放链接</button><button id="stopMusic">停止音乐</button><label>难度<input id="difficulty" type="range" min="0" max="1" step=".05" value=".5"></label><label><input id="adaptive" type="checkbox" checked>自适应</label><button id="setDifficulty">应用难度</button><p>音乐统一转换为 16 kHz 单声道供板端播放；这不等于原始音乐无损。支持保留原控制台中的游戏按钮。</p></section>
<section><h2>连接状态</h2><p>MCP：当前主机的 <code>/mcp</code>；音频传输方式由 PC 启动配置决定。</p><pre id="status"></pre></section>
</main><script src="matrix3d.js?v=20261023c"></script><script src="pro.js?v=20261023c"></script></body></html>
